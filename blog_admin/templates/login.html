<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登入 — AICDN CMS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1629;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.brand{text-align:center;margin-bottom:28px}
.brand h1{font-size:22px;font-weight:800;color:#0f1629}
.brand h1 span{color:#5b8dee}
.brand p{font-size:13px;color:#718096;margin-top:4px}
label{display:block;font-size:13px;font-weight:600;color:#2d3748;margin-bottom:6px}
input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s;color:#1a202c}
input:focus{border-color:#5b8dee}
.field{margin-bottom:18px}
.btn-login{width:100%;padding:12px;background:#5b8dee;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;margin-top:4px}
.btn-login:hover{background:#4a7de0}
.error{background:#fff5f5;border:1px solid #feb2b2;color:#9b2c2c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:18px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>AICDN <span>CMS</span></h1>
    <p>內部文章管理後台</p>
  </div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="field">
      <label>帳號</label>
      <input type="text" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn-login">登入</button>
  </form>
</div>
</body>
</html>
